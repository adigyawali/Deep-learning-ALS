# End-to-end CNN -> nnMamba.  One 3D CNN stem runs over the three modalities and
# produces ONE feature map; that map is then split into a spatial view and an FFT
# log-magnitude view, and both are fed as one token sequence into a single Mamba
# (selective state-space) stack.  `data.streams` below picks which of those two
# views the Mamba actually sees.
seed: 42

data:
  data_dir: null                # null -> Data/processed
  target_shape: [128, 128, 128]

  # ── WHICH TOKEN STREAMS REACH THE MAMBA STACK ────────────────────────────
  # The CNN stem, the Mamba stack and the classifier head are IDENTICAL in all
  # three settings — only the token sequence changes — so this is a clean
  # one-factor ablation.  The dataset always loads 3 spatial channels; this
  # switches a branch inside the model, never the input.
  #
  #   both      : spatial tokens THEN frequency tokens, concatenated into one
  #               sequence (2 * token_grid^3 tokens).  The default.
  #   spatial   : spatial tokens only (token_grid^3).  Also the fastest.
  #   frequency : FFT-log-magnitude tokens only (token_grid^3).
  #
  # Override per run without editing this file:
  #   python experiment.py --model cnn_nnmamba --streams frequency
  # (`--no-frequency` is kept as an alias for `--streams spatial`.)
  streams: both

  # DEPRECATED, kept so old configs keep working: use_frequency: true == streams:
  # both, false == streams: spatial.  It is read ONLY when `streams` is absent.
  # use_frequency: true

  aug_level: heavy              # FALLBACK preset only — the root config.yaml `augmentations:`
                                # section overrides this when present (single source of truth).

# FALLBACK only. Augmentations AND folds are configured in the root config.yaml
# (`augmentations:` and `cross_validation:`), which overrides this `split:` block
# whenever config.yaml is present. Kept so the pipeline still works without it.
split:
  n_folds: 5                    # 5-fold stratified CV over the 80% CV pool
  test_ratio: 0.2               # fixed, subject-level held-out test set

dataloader:
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

nnmamba:
  # ── CNN stem (shared by both branches — the split happens after it) ──────
  # 'pretrained' = MedicalNet 3D-ResNet transfer learning (recommended: the main
  #   fix for the train->test overfitting gap on this small dataset).
  # 'scratch'    = original from-scratch conv trunk (use for the ablation).
  spatial_encoder: pretrained
  backbone: resnet10            # resnet10 or resnet50 (the only sizes with downloadable
                                # MedicalNet weights). resnet10 = smaller / less VRAM / less overfit.
  freeze_backbone: true         # freeze the pretrained stem; train only fusion+Mamba+head
  pretrained_d_model: 256       # fused spatial embedding width (pretrained path only)
  # ── Scratch-stem sizing (used only when spatial_encoder: scratch) ─────────
  base: 32                      # base conv width (doubles per downsample block, capped at 256)
  blocks: 3                     # number of stride-2 downsample blocks
  # ── Shared token / Mamba sizing (both stems) ──────────────────────────────
  token_grid: 4                 # adaptive-pool grid -> token_grid^3 tokens PER STREAM, so the
                                # Mamba sequence is 2*token_grid^3 with streams: both
                                # (128 tokens at 4) and token_grid^3 for a single stream.
                                # Bounds memory regardless of input resolution.
  mamba_layers: 2               # one shared stack over the concatenated spatial+frequency tokens
  d_state: 16
  dropout: 0.3                  # raised from 0.1: stronger regularisation for small data
  epochs: 100
  batch_size: 2
  grad_accum_steps: 2           # effective batch 4 at low per-step VRAM
  lr: 1.0e-4
  weight_decay: 0.05            # raised from 1e-4: AdamW decoupled decay, small-data regime
  warmup_epochs: 5

train:
  best_metric: roc_auc
  label_smoothing: 0.1          # soften targets: curbs over-confident memorisation, improves calibration
  early_stop_patience: 20
  clip_grad: 1.0
  amp: bf16

eval:
  bootstrap_n: 2000
