# CNN -> nnMamba (two stages, one command).
# One 3D CNN stem reads the three modalities and produces ONE feature map; that
# map is split into a spatial view and an FFT log-magnitude view, and both are
# fed as a single token sequence into one Mamba stack.
seed: 42

data:
  data_dir: null                # null -> Data/processed
  target_shape: [128, 128, 128]

  # Which token streams the Mamba stack sees. Stem, stack and head are identical
  # in all three settings — only the token sequence changes — so this is a clean
  # one-factor ablation of the FFT branch:
  #   both      : spatial then frequency tokens (2 * token_grid^3). Default.
  #   spatial   : spatial only (token_grid^3). Fastest.
  #   frequency : FFT tokens only (token_grid^3).
  # Override per run: python experiment.py --model cnn_nnmamba --streams frequency
  streams: both

  aug_level: heavy              # fallback preset only — the root config.yaml
                                # `augmentations:` block overrides this

# Fallback only: augmentations AND folds come from the root config.yaml. Kept so
# the pipeline still works without that file.
split:
  n_folds: 5
  test_ratio: 0.2

dataloader:
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

nnmamba:
  # ── CNN stem (shared by both views — the split happens after it) ───────────
  spatial_encoder: pretrained   # pretrained = MedicalNet transfer learning
                                # scratch    = from-scratch conv trunk (ablation)
  backbone: resnet10            # resnet10 | resnet50 (the only sizes with
                                # downloadable MedicalNet weights)
  freeze_backbone: true         # train only fusion + Mamba + head
  pretrained_d_model: 256       # fused embedding width (pretrained path only)
  base: 32                      # scratch stem only: base conv width
  blocks: 3                     # scratch stem only: stride-2 blocks

  # ── Tokens and Mamba ──────────────────────────────────────────────────────
  token_grid: 4                 # token_grid^3 tokens PER STREAM (64 at 4), so
                                # the sequence is 128 with streams: both. Bounds
                                # memory regardless of input resolution.
  mamba_layers: 2               # one shared stack over the whole sequence
  d_state: 16
  dropout: 0.3

  # ── Optimisation ──────────────────────────────────────────────────────────
  epochs: 100
  batch_size: 2
  grad_accum_steps: 2           # effective batch 4 at low per-step VRAM
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 5

train:
  best_metric: roc_auc
  label_smoothing: 0.1          # curbs over-confident memorisation on small data
  early_stop_patience: 20
  clip_grad: 1.0
  amp: bf16

eval:
  bootstrap_n: 2000
