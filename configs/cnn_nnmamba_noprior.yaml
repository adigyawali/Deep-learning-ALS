# ABLATION: "no transfer learning" — identical to configs/cnn_nnmamba.yaml except
# the MedicalNet prior is removed.  The ResNet10 architecture is kept, so any
# difference vs. the main run is attributable to the pretrained weights alone and
# not to a change of encoder topology.
#
# MUST be run with ALS_SKIP_PRETRAINED=1 in the environment — that env var is what
# actually skips the MedicalNet download and leaves the backbone randomly
# initialised.  Without it this config silently trains a *fine-tuned* pretrained
# backbone, which is a different experiment.
#
#   ALS_SKIP_PRETRAINED=1 python3 experiment.py --model cnn_nnmamba \
#       --config configs/cnn_nnmamba_noprior.yaml \
#       --output-dir runs_noprior train_nnmamba evaluate
seed: 42

data:
  data_dir: null                # null -> Data/processed
  target_shape: [128, 128, 128]
  streams: both                 # both | spatial | frequency — which token streams the Mamba
                                # sees. Keep this the SAME as configs/cnn_nnmamba.yaml, or this
                                # ablation stops being about the pretrained weights alone.
                                # See configs/cnn_nnmamba.yaml for the full explanation.
  aug_level: heavy              # FALLBACK preset only — the root config.yaml `augmentations:`
                                # section overrides this when present (single source of truth).

# FALLBACK only. Augmentations AND folds are configured in the root config.yaml
# (`augmentations:` and `cross_validation:`), which overrides this `split:` block
# whenever config.yaml is present. Kept so the pipeline still works without it.
split:
  n_folds: 5                    # 5-fold stratified CV over the 80% CV pool
  test_ratio: 0.2               # fixed, subject-level held-out test set

dataloader:
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

nnmamba:
  # ── Spatial stream ──────────────────────────────────────────────────────
  # 'pretrained' = MedicalNet 3D-ResNet transfer learning (recommended: the main
  #   fix for the train->test overfitting gap on this small dataset).
  # 'scratch'    = original from-scratch Encoder3D (use for the ablation).
  spatial_encoder: pretrained
  backbone: resnet10            # resnet10 or resnet50 (the only sizes with downloadable
                                # MedicalNet weights). resnet10 = smaller / less VRAM / less overfit.
  freeze_backbone: false        # ABLATION: backbone is randomly initialised, so it MUST be
                                # trainable — freezing random weights would measure nothing.
  pretrained_d_model: 256       # fused spatial embedding width (pretrained path only)
  # ── Scratch-stream sizing (used when spatial_encoder: scratch; also sizes the
  #    frequency stream, which is always trained from scratch) ───────────────
  base: 32                      # base conv width (doubles per downsample block, capped at 256)
  blocks: 3                     # number of stride-2 downsample blocks
  token_grid: 4                 # adaptive-pool grid -> token_grid^3 Mamba tokens (bounds memory)
  mamba_layers: 2
  d_state: 16
  dropout: 0.3                  # raised from 0.1: stronger regularisation for small data
  epochs: 100
  batch_size: 2
  grad_accum_steps: 2           # effective batch 4 at low per-step VRAM
  lr: 1.0e-4
  weight_decay: 0.05            # raised from 1e-4: AdamW decoupled decay, small-data regime
  warmup_epochs: 5

train:
  best_metric: roc_auc
  label_smoothing: 0.1          # soften targets: curbs over-confident memorisation, improves calibration
  early_stop_patience: 20
  clip_grad: 1.0
  amp: bf16

eval:
  bootstrap_n: 2000
