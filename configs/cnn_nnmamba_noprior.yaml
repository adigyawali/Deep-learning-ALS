# ABLATION: "no transfer learning" — identical to configs/cnn_nnmamba.yaml except
# the MedicalNet prior is removed. The ResNet10 architecture is kept, so any
# difference is attributable to the pretrained weights alone.
#
# MUST be run with ALS_SKIP_PRETRAINED=1 — that env var is what actually skips
# the download and leaves the backbone randomly initialised. Without it this
# config silently trains a *fine-tuned* pretrained backbone instead:
#
#   ALS_SKIP_PRETRAINED=1 python3 experiment.py --model cnn_nnmamba \
#       --config configs/cnn_nnmamba_noprior.yaml \
#       --output-dir runs_noprior train_nnmamba evaluate
seed: 42

data:
  data_dir: null                # null -> Data/processed
  target_shape: [128, 128, 128]
  streams: both                 # keep this the SAME as configs/cnn_nnmamba.yaml,
                                # or the ablation stops being about the weights
  aug_level: heavy              # fallback preset only — root config.yaml wins

# Fallback only: augmentations AND folds come from the root config.yaml.
split:
  n_folds: 5
  test_ratio: 0.2

dataloader:
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

nnmamba:
  spatial_encoder: pretrained
  backbone: resnet10
  freeze_backbone: false        # the backbone is randomly initialised here, so it
                                # MUST be trainable — freezing random weights
                                # would measure nothing
  pretrained_d_model: 256
  base: 32
  blocks: 3
  token_grid: 4
  mamba_layers: 2
  d_state: 16
  dropout: 0.3
  epochs: 100
  batch_size: 2
  grad_accum_steps: 2
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 5

train:
  best_metric: roc_auc
  label_smoothing: 0.1
  early_stop_patience: 20
  clip_grad: 1.0
  amp: bf16

eval:
  bootstrap_n: 2000
