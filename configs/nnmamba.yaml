# ONE-STAGE nnMamba — no CNN at all.
#
# The preprocessed volumes go straight into the Mamba stack: cut into
# non-overlapping 3D patches, one linear projection per patch, and the
# state-space stack does all the representation learning. Compare against
# configs/cnn_nnmamba.yaml (same data, folds and loss) to measure what the
# convolutional prior is worth.
#
#   (B, 3, 128, 128, 128)
#        -> PatchEmbed3D       one strided linear map; FUSES T1/T2/FLAIR here
#        -> (B, d_model, 8, 8, 8)
#        -> spatial tokens ++ FFT-log-magnitude tokens (concat + pos-embed)
#        -> BiMamba x mamba_layers -> LayerNorm -> mean over tokens
#        -> Linear -> 1 logit
seed: 42

data:
  data_dir: null                # null -> Data/processed
  target_shape: [128, 128, 128] # MUST be divisible by nnmamba.patch_size below
  streams: both                 # both | spatial | frequency — same meaning as in
                                # configs/cnn_nnmamba.yaml, so the ablation is
                                # comparable across the two models
  aug_level: heavy              # fallback preset only — root config.yaml wins

# Fallback only: augmentations AND folds come from the root config.yaml.
split:
  n_folds: 5
  test_ratio: 0.2

dataloader:
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

# The block is named `nnmamba:` for BOTH Mamba models so the shared stages read
# one key. There is no spatial_encoder / backbone / freeze_backbone here: this
# model has no CNN, so ALS_REQUIRE_PRETRAINED and ALS_MEDICALNET_WEIGHTS have no
# effect on it.
nnmamba:
  patch_size: 16                # THE sequence-length lever. Tokens per stream =
                                # (target_shape / patch_size)^3:
                                #   16 -> 8^3 = 512 (1024 with streams: both)
                                #   32 -> 4^3 =  64
                                # Raise it to 32 if the log says the Mamba backend
                                # is `pytorch-fallback` — its scan is an O(L)
                                # Python loop (see docs/models.md).
  d_model: 192                  # token width. The patch projection holds
                                # 3*patch_size^3*d_model params (~2.4M here),
                                # where most of this model's overfitting risk lives.

  mamba_layers: 4               # deeper than cnn_nnmamba's 2: with no CNN, all of
                                # the representation learning happens here
  d_state: 16
  bidirectional: true           # scan forwards AND backwards, then average. A
                                # token here IS its patch with no receptive field,
                                # so a causal forward-only scan would leave the
                                # first patches with no context. false = the
                                # cnn_nnmamba behaviour.
  dropout: 0.3

  epochs: 100
  batch_size: 2
  grad_accum_steps: 2           # effective batch 4 at low per-step VRAM
  lr: 3.0e-4                    # higher than cnn_nnmamba's 1e-4: every parameter
                                # here is trained from scratch
  weight_decay: 0.05
  warmup_epochs: 5

train:
  best_metric: roc_auc
  label_smoothing: 0.1
  early_stop_patience: 20
  clip_grad: 1.0
  amp: bf16

eval:
  bootstrap_n: 2000
