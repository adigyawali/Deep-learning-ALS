# CNN -> spatial ViT (two stages).
# Stage 1 fine-tunes a tri-stream MedicalNet ResNet on full volumes; stage 2
# trains the ViT on the layer4 feature maps that stage dumps.
seed: 42

data:
  data_dir: null                # null -> Data/processed
  target_shape: [128, 128, 128]
  aug_level: medium             # fallback preset only — root config.yaml wins

# Fallback only: augmentations AND folds come from the root config.yaml.
split:
  n_folds: 5
  test_ratio: 0.2

dataloader:
  num_workers: 2                # each worker loads 3 full volumes — the host-RAM lever
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

# Stage 1 — tri-stream 3D CNN (the memory-heavy stage).
cnn:
  backbone: resnet50            # resnet10 | resnet50 (resnet10 = less VRAM)
  freeze_backbone: false
  epochs: 60
  batch_size: 4
  grad_accum_steps: 1           # raise to keep the effective batch while cutting VRAM
  lr_backbone: 1.0e-5
  lr_head: 1.0e-3
  weight_decay: 0.05
  warmup_epochs: 5

# Stage 2 — spatial multi-modal ViT (cheap; trains on the small feature maps).
vit:
  embed_dim: 384
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.15
  modality_dropout_prob: 0.25   # randomly drop a modality's tokens while training
  epochs: 60
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_epochs: 5

train:
  best_metric: roc_auc          # roc_auc | pr_auc | balanced_accuracy
  early_stop_patience: 15
  clip_grad: 1.0
  amp: bf16                     # bf16 | fp16 | none (CUDA only; ignored elsewhere)

eval:
  bootstrap_n: 2000
