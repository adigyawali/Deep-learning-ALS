# =============================================================================
# Shared experiment config: DATA AUGMENTATION and CROSS-VALIDATION SPLITS.
#
# This file is the single source of truth for both, across all three models
# (cnn_vit, cnn_nnmamba, nnmamba). It is read automatically and overrides the
# equivalent blocks in configs/<model>.yaml. Per-model architecture and training
# hyper-parameters live there, not here.
# =============================================================================

# ── DATA AUGMENTATION ────────────────────────────────────────────────────────
# Training data only — validation and test are NEVER augmented.
augmentations:
  enabled: true             # master switch; false = train with no augmentation

  # MixUp trains on blends of subject pairs:
  #     x~ = L*x_i + (1-L)*x_j    y~ = L*y_i + (1-L)*y_j    L ~ Beta(alpha, alpha)
  # It needs two samples at once, so it is applied by the trainer to each
  # training batch rather than being a per-sample transform below.
  #   alpha : Beta shape. 0.2 = mostly-mild mixing (the small-dataset default);
  #           larger values mix harder and start to blur the anatomy.
  #   prob  : fraction of training batches that get mixed (1.0 = all).
  # T1/T2/FLAIR are mixed with the same partner and the same L, so the blend
  # stays one coherent subject. While mixup is on the training ROC-AUC prints as
  # `nan` (the targets are soft) — read the validation numbers instead.
  mixup:
    enabled: false
    alpha: 0.2
    prob: 1.0

  # Each entry is one augmentation:
  #   name    : any class in monai.transforms (RandFlip, RandAffine,
  #             RandGaussianNoise, RandAdjustContrast, RandBiasField, ...)
  #   enabled : turn it off without deleting it
  #   group   : "geometric" or "intensity" — see below
  #   params  : passed straight to that MONAI transform
  # Add one by copying a block; remove one by deleting it. No code changes.
  #
  # group matters for co-registered multi-modal MRI:
  #   geometric = moves voxels (flip, affine, rotate, zoom). Sampled ONCE and
  #               applied to T1/T2/FLAIR together so they stay aligned.
  #   intensity = changes voxel values only (noise, contrast, bias field, blur).
  #               Applied after the geometric group.
  # Rule of thumb: does it move the image? geometric. If unsure, intensity.
  transforms:
    - name: RandFlip                    # left-right flip; the brain is ~symmetric
      enabled: true
      group: geometric
      params: {prob: 0.5, spatial_axis: 0}

    - name: RandAffine                  # small shift / rotation / scale
      enabled: true
      group: geometric
      params:
        prob: 0.7
        translate_range: [3, 3, 3]
        rotate_range: [0.087, 0.087, 0.087]   # radians (~5 degrees)
        scale_range: [0.1, 0.1, 0.1]
        padding_mode: border

    - name: RandGaussianNoise           # thermal / Rician noise proxy
      enabled: true
      group: intensity
      params: {prob: 0.3, std: 0.05}

    - name: RandAdjustContrast          # gamma contrast jitter
      enabled: true
      group: intensity
      params: {prob: 0.3, gamma: [0.7, 1.5]}

    - name: RandBiasField               # coil intensity inhomogeneity (MRI-specific)
      enabled: true
      group: intensity
      params: {prob: 0.3, coeff_range: [0.0, 0.1]}

    - name: RandGaussianSmooth          # resolution / partial-volume variation
      enabled: false                    # disabled, kept for easy re-enabling
      group: intensity
      params: {prob: 0.15, sigma_x: [0.5, 1.0], sigma_y: [0.5, 1.0], sigma_z: [0.5, 1.0]}


# ── CROSS-VALIDATION SPLITS ──────────────────────────────────────────────────
cross_validation:
  # The split is written ONCE to this file and reused by every run, stage, model
  # and --output-dir. That is what makes two experiments comparable: they are
  # scored on the identical held-out test subjects.
  #
  #   python experiment.py --model cnn_nnmamba splits              # show it
  #   python experiment.py --model cnn_nnmamba splits --reshuffle  # draw a new one
  #
  # Reshuffling records the new random seed in the file, so the new split is
  # itself reproducible (pass it back with --seed to recreate it exactly).
  # Set to null for a per-experiment split at <output-dir>/splits.json instead.
  splits_file: splits.json   # relative paths are from the project root

  # auto     -> generate stratified, subject-level folds (reproducible from `seed`)
  # explicit -> use exactly the patient IDs listed below; nothing is randomised
  mode: auto

  # ---- used when mode: auto ----
  n_folds: 5
  test_ratio: 0.2          # fraction of subjects held out as the fixed test set
  seed: 42
  stratify_by_site: true   # engages only if every (label, site) bucket has
                           # >= n_folds + 1 subjects; otherwise label-only

  # ---- used when mode: explicit ----
  # Subject IDs (C001, P042), matched case-insensitively. Every subject may
  # appear at most once (test OR one fold); an unknown ID is ignored with a
  # warning; a subject listed nowhere is DROPPED with a loud warning. The number
  # of folds is the number of lists under `folds:`.
  #
  # test_subjects: [C001, C002, P001, P002]
  # folds:
  #   - [C010, C011, P010, P011]      # fold 0 validation subjects
  #   - [C012, C013, P012, P013]      # fold 1
  #   - [C014, C015, P014, P015]      # fold 2
  #   - [C016, C017, P016, P017]      # fold 3
  #   - [C018, C019, P018, P019]      # fold 4
